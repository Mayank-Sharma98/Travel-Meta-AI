{% include 'header.html' %}<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><section class="page-head"><div class="container"><div class="eyebrow">OpenStreetMap</div><h1>Explore on the map</h1></div></section><section class="section"><div class="container"><div id="map" class="map-canvas"></div><p class="mt-3 text-muted">Demo map markers show featured destinations. Add verified public points of interest through the map service for production.</p></div></section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let m=L.map('map').setView([22.7,82.5],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);{% for d in destinations %}L.marker([{{d.latitude}},{{d.longitude}}]).addTo(m).bindPopup('<b>{{d.name|escapejs}}</b><br>{{d.state|escapejs}}');{% endfor %}})</script>{% include 'footer.html' %}
