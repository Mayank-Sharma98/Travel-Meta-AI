{% include 'header.html' %}<section class="page-head"><div class="container"><div class="eyebrow">Demo assistant</div><h1>Ask TravelMate</h1></div></section><section class="section"><div class="container chat"><div id="messages"><div class="bubble bot">Hi! Ask me about Jharkhand, budget ideas, or a quick getaway.</div></div><form id="chatForm" class="d-flex gap-2"><input id="chatInput" class="form-control" placeholder="What can I visit in Jharkhand?"><button class="btn btn-forest">Send</button></form></div></section><script>document.addEventListener('DOMContentLoaded',()=>{chatForm.onsubmit=e=>{e.preventDefault();let q=chatInput.value.trim();if(!q)return;messages.innerHTML+=`<div class="bubble me">${q}</div>`;let a=/jharkhand/i.test(q)?'Try Netarhat for sunsets, Betla for wildlife, or Dassam Falls for a day trip.':'For a balanced trip, set aside 35% for stays, 25% for transport, 25% for food and activities, and a 15% buffer.';messages.innerHTML+=`<div class="bubble bot">${a} (local demo response)</div>`;chatInput.value=''}})</script>{% include 'footer.html' %}
